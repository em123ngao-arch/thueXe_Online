spring:
  application:
    name: driveshare-backend
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:ajutfp98}
  api-key: ${CLOUDINARY_API_KEY:264588314216624}
  api-secret: ${CLOUDINARY_API_SECRET:rVsIDYc1lxeUovD8FyvWp7Jat5o}

driveshare:
  upload:
    dir: uploads

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}

langfuse:
  enabled: ${LANGFUSE_ENABLED:true}
  host: ${LANGFUSE_HOST:https://cloud.langfuse.com}
  public-key: ${LANGFUSE_PUBLIC_KEY:pk-lf-a2bdde2f-b2bf-4e66-99e3-371dee55bb0b}
  secret-key: ${LANGFUSE_SECRET_KEY:sk-lf-f5728999-6cb0-483d-92ae-5a8281f768cf}


server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
