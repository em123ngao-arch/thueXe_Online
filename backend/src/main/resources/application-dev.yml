spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/driveshare_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

driveshare:
  jwt:
    # 256-bit Base64 encoded secret key
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000        # 24 giờ cho Access Token
    refresh-expiration-ms: 604800000 # 7 ngày cho Refresh Token

logging:
  level:
    com.driveshare: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
