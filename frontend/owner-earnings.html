<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Doanh Thu & Lịch Sử Thanh Toán — DriveShare</title>
  <meta name="description" content="Quản lý và thống kê tổng doanh thu, dòng tiền cọc VietQR của chủ xe" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/portals.css" />
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
    }
  </style>
</head>
<body>
  <!-- Site Header -->
  <header class="site-header">
    <div class="container nav-container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="brand-logo" style="display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: inherit;">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path>
          <circle cx="7" cy="17" r="2"></circle>
          <path d="M9 17h6"></path>
          <circle cx="17" cy="17" r="2"></circle>
        </svg>
        <span style="font-weight: 800; font-size: 1.25rem;">DriveShare</span>
        <span class="brand-badge" style="background: #ecfdf5; color: #047857; font-weight: 700;">Kênh Chủ Xe</span>
      </a>

      <div class="nav-actions" style="display: flex; gap: 0.75rem; align-items: center;">
        <a href="owner-cars.html" class="btn btn-ghost btn-sm" style="font-weight: 600;">
          Quản lý xe
        </a>
        <a href="owner-earnings.html" class="btn btn-outline btn-sm" style="font-weight: 700; color: var(--primary); border-color: var(--primary);">
          Doanh thu & Lịch sử
        </a>
        <a href="profile.html" class="btn btn-ghost btn-sm" style="font-weight: 600;">
          Hồ sơ cá nhân
        </a>
        <button class="btn btn-ghost btn-sm" onclick="AuthService.logout()" style="font-weight: 600; color: #ef4444;">
          Đăng xuất
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main id="ownerEarningsMainContent">
    <div id="ownerEarningsContainer">
      <!-- Sẽ được OwnerEarningsUI.init() render linh hoạt -->
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/owner-earnings.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof StorageService !== 'undefined') {
        StorageService.init();
      }
      if (typeof checkAuth === 'function') {
        if (checkAuth("OWNER")) {
          OwnerEarningsUI.init();
        }
      } else {
        OwnerEarningsUI.init();
      }
    });
  </script>
</body>
</html>
