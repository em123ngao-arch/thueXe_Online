<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quản Lý Doanh Thu & Quyết Toán Sàn — DriveShare Admin</title>
  <meta name="description" content="Kênh quản trị tài chính, theo dõi tổng GMV, hoa hồng sàn 10%, quỹ ký quỹ VietQR và đối soát giải ngân cho chủ xe" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/portals.css" />
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
    }
    .kpi-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-badge-pending-payout {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }
    .status-badge-paid-out {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .status-badge-deposit-paid {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .status-badge-cancelled {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <!-- Site Header -->
  <header class="site-header">
    <div class="container nav-container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="brand-logo" style="display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: inherit;">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path>
          <circle cx="7" cy="17" r="2"></circle>
          <path d="M9 17h6"></path>
          <circle cx="17" cy="17" r="2"></circle>
        </svg>
        <span style="font-weight: 800; font-size: 1.25rem;">DriveShare</span>
        <span class="brand-badge" style="background: #fee2e2; color: #b91c1c; font-weight: 700; border-color: #fca5a5;">Admin Portal</span>
      </a>

      <div class="nav-actions" style="display: flex; gap: 0.75rem; align-items: center;">
        <a href="admin.html" class="btn btn-ghost btn-sm" style="font-weight: 600;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px; margin-right: 4px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          Kiểm duyệt & Vận hành
        </a>
        <a href="admin-revenue.html" class="btn btn-outline btn-sm" style="font-weight: 700; color: #059669; border-color: #059669; background: #ecfdf5;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px; margin-right: 4px;"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          Doanh thu & Quyết toán sàn
        </a>
        <a href="profile.html" class="btn btn-ghost btn-sm" style="font-weight: 600;">
          Hồ sơ Admin
        </a>
        <button class="btn btn-ghost btn-sm" onclick="AuthService.logout()" style="font-weight: 600; color: #ef4444;">
          Đăng xuất
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main id="adminRevenueMainContent">
    <div id="adminRevenueContainer">
      <!-- Sẽ được AdminRevenueUI.init() render tự động -->
    </div>
  </main>

  <!-- Payout Voucher Modal (Ủy nhiệm chi giải ngân cho chủ xe) -->
  <div class="modal-overlay" id="payoutModalOverlay" style="display: none;">
    <div class="modal-dialog" style="max-width: 520px;">
      <div class="modal-header">
        <h3 class="modal-title" id="payoutModalTitle">Ủy Nhiệm Chi / Lệnh Giải Ngân Chủ Xe</h3>
        <button class="modal-close-btn" onclick="AdminRevenueUI.closePayoutModal()">&times;</button>
      </div>
      <div class="modal-body" id="payoutModalBody">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js?v=3.6"></script>
  <script src="js/storage.js?v=3.6"></script>
  <script src="js/toast.js?v=3.6"></script>
  <script src="js/auth.js?v=3.6"></script>
  <script src="js/api.js?v=3.6"></script>
  <script src="js/admin-revenue.js?v=3.6"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof StorageService !== 'undefined') {
        StorageService.init();
      }
      const urlParams = new URLSearchParams(window.location.search);
      const isPreview = urlParams.get('preview') === 'true';

      if (isPreview) {
        if (!localStorage.getItem('access_token')) {
          localStorage.setItem('access_token', 'demo_admin_jwt');
          localStorage.setItem('user_info', JSON.stringify({ userId: 1, role: 'ROLE_ADMIN', roles: ['ROLE_ADMIN'], fullName: 'Quản Trị Viên' }));
        }
        AdminRevenueUI.init();
      } else if (typeof checkAuth === 'function') {
        if (checkAuth("ADMIN")) {
          AdminRevenueUI.init();
        }
      } else {
        AdminRevenueUI.init();
      }
    });
  </script>
</body>
</html>
