<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Kênh Quản Trị & Thẩm Định — DriveShare</title>
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Stylesheets with Cache Busting -->
    <link rel="stylesheet" href="css/base.css?v=20261022_v4" />
    <link rel="stylesheet" href="css/components.css?v=20261022_v4" />
    <link rel="stylesheet" href="css/portals.css?v=20261022_v4" />

    <!-- Embedded Mioto Bookings Styles: Clean Enterprise SaaS Layout -->
    <style>
      .bookings-admin-card {
        background: #ffffff !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 12px !important;
        box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04) !important;
        padding: 1.5rem !important;
        margin-bottom: 2rem !important;
      }
      .bookings-admin-header {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        flex-wrap: wrap !important;
        gap: 1rem !important;
        margin-bottom: 1.25rem !important;
        border-bottom: 1px solid #f1f5f9 !important;
        padding-bottom: 1rem !important;
      }
      .bookings-admin-header h3 {
        font-size: 1.2rem !important;
        font-weight: 800 !important;
        color: #0f172a !important;
        display: flex !important;
        align-items: center !important;
        gap: 8px !important;
        margin: 0 !important;
      }
      .bookings-admin-header p {
        color: #64748b !important;
        font-size: 0.84rem !important;
        margin-top: 3px !important;
        margin-bottom: 0 !important;
      }
      
      /* Segmented Control Bar (Apple/Stripe Style) */
      .segmented-nav-container {
        background: #f1f5f9 !important;
        border-radius: 10px !important;
        padding: 4px !important;
        display: inline-flex !important;
        gap: 4px !important;
        flex-wrap: wrap !important;
        margin-bottom: 1.25rem !important;
      }
      .segmented-tab-btn {
        display: inline-flex !important;
        align-items: center !important;
        gap: 6px !important;
        padding: 7px 14px !important;
        border-radius: 7px !important;
        border: none !important;
        background: transparent !important;
        font-size: 0.82rem !important;
        font-weight: 600 !important;
        color: #475569 !important;
        cursor: pointer !important;
        transition: all 0.18s ease !important;
        user-select: none !important;
      }
      .segmented-tab-btn:hover {
        color: #0f172a !important;
      }
      .segmented-tab-btn.active {
        background: #ffffff !important;
        color: #0f172a !important;
        font-weight: 700 !important;
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08) !important;
      }
      .segmented-count-badge {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 1px 6px !important;
        border-radius: 9999px !important;
        font-size: 0.72rem !important;
        font-weight: 700 !important;
        background: #e2e8f0 !important;
        color: #475569 !important;
      }
      .segmented-tab-btn.active .segmented-count-badge {
        background: #0f766e !important;
        color: #ffffff !important;
      }

      /* Unified Clean Toolbar */
      .booking-clean-toolbar {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        gap: 12px !important;
        margin-bottom: 1.2rem !important;
        flex-wrap: wrap !important;
      }
      .booking-search-wrapper {
        position: relative !important;
        flex: 1 !important;
        min-width: 280px !important;
        max-width: 440px !important;
      }
      .booking-search-wrapper svg {
        position: absolute !important;
        left: 12px !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        color: #94a3b8 !important;
        pointer-events: none !important;
      }
      .booking-search-field {
        width: 100% !important;
        padding: 8px 12px 8px 36px !important;
        border: 1.5px solid #cbd5e1 !important;
        border-radius: 8px !important;
        font-size: 0.85rem !important;
        color: #0f172a !important;
        outline: none !important;
        background: #ffffff !important;
        box-sizing: border-box !important;
        transition: border-color 0.15s, box-shadow 0.15s !important;
      }
      .booking-search-field:focus {
        border-color: #0f766e !important;
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1) !important;
      }
      .booking-actions-group {
        display: flex !important;
        gap: 8px !important;
        align-items: center !important;
        flex-wrap: wrap !important;
      }

      /* Clean Data Table */
      .mioto-table {
        width: 100% !important;
        border-collapse: separate !important;
        border-spacing: 0 !important;
        font-size: 0.86rem !important;
      }
      .mioto-table th {
        background: #f8fafc !important;
        color: #475569 !important;
        font-weight: 700 !important;
        font-size: 0.74rem !important;
        text-transform: uppercase !important;
        letter-spacing: 0.6px !important;
        padding: 12px 14px !important;
        border-bottom: 1.5px solid #e2e8f0 !important;
        text-align: left !important;
        white-space: nowrap !important;
      }
      .mioto-table td {
        padding: 12px 14px !important;
        border-bottom: 1px solid #f1f5f9 !important;
        vertical-align: middle !important;
        color: #1e293b !important;
      }
      .mioto-table tr:hover td {
        background-color: #f8fafc !important;
      }
      
      /* Status Badges */
      .mioto-status-badge {
        display: inline-flex !important;
        align-items: center !important;
        gap: 5px !important;
        padding: 4px 10px !important;
        border-radius: 9999px !important;
        font-size: 0.74rem !important;
        font-weight: 700 !important;
        line-height: 1.3 !important;
        white-space: nowrap !important;
      }
      .status-waiting { background: #e0f2fe !important; color: #0369a1 !important; border: 1px solid #bae6fd !important; }
      .status-confirmed { background: #dcfce7 !important; color: #15803d !important; border: 1px solid #bbf7d0 !important; }
      .status-inprogress { background: #ede9fe !important; color: #6d28d9 !important; border: 1px solid #ddd6fe !important; }
      .status-completed { background: #ccfbf1 !important; color: #0f766e !important; border: 1px solid #99f6e4 !important; }
      .status-host-cancel { background: #fee2e2 !important; color: #b91c1c !important; border: 1px solid #fecaca !important; }
      .status-disputed { background: #fef3c7 !important; color: #b45309 !important; border: 1px solid #fde68a !important; }
      .status-cancelled { background: #f1f5f9 !important; color: #475569 !important; border: 1px solid #cbd5e1 !important; }
      .status-rejected { background: #fef2f2 !important; color: #991b1b !important; border: 1px solid #fecaca !important; }

      /* Pagination */
      .booking-pagination {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        padding-top: 1rem !important;
        margin-top: 0.75rem !important;
        border-top: 1px solid #f1f5f9 !important;
        flex-wrap: wrap !important;
        gap: 1rem !important;
      }
      .page-btn {
        min-width: 30px !important;
        height: 30px !important;
        padding: 0 8px !important;
        border-radius: 6px !important;
        border: 1px solid #e2e8f0 !important;
        background: #ffffff !important;
        color: #334155 !important;
        font-size: 0.8rem !important;
        font-weight: 600 !important;
        cursor: pointer !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        transition: all 0.15s !important;
      }
      .page-btn:hover:not(:disabled) {
        border-color: #0f766e !important;
        color: #0f766e !important;
        background: #f0fdfa !important;
      }
      .page-btn.active {
        background: #0f766e !important;
        color: #ffffff !important;
        border-color: #0f766e !important;
      }
      .page-btn:disabled {
        opacity: 0.35 !important;
        cursor: not-allowed !important;
      }
    </style>
  </head>
  <body>
    <!-- Site Header -->
    <header class="site-header">
      <div class="container nav-container">
        <a href="index.html" class="brand-logo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"
            ></path>
            <circle cx="7" cy="17" r="2"></circle>
            <path d="M9 17h6"></path>
            <circle cx="17" cy="17" r="2"></circle>
          </svg>
          <span>DriveShare</span>
          <span class="brand-badge" style="background: #fee2e2; color: #b91c1c; border-color: #fca5a5;">Admin Portal</span>
        </a>
        <div class="nav-actions">
          <a href="admin-revenue.html" class="btn btn-outline btn-sm" style="font-weight: 700; color: #059669; border-color: #059669;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px; margin-right: 4px;"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            Doanh thu & Quyết toán sàn
          </a>
          <a href="index.html" class="btn btn-ghost btn-sm" style="font-weight: 600;">
            Trang chủ
          </a>
          <a href="profile.html" class="btn btn-ghost btn-sm" style="font-weight: 600;">
            Hồ sơ cá nhân
          </a>
          <button class="btn btn-ghost btn-sm" onclick="AuthService.logout()" style="font-weight: 600; color: #ef4444;">
            Đăng xuất
          </button>
        </div>
      </div>
    </header>

    <main id="adminMainContent">
      <div id="adminPortalContainer">
        <!-- Rendered by AdminService.renderAdminPortal() -->
      </div>
    </main>

    <!-- General Action Modal (Rejection reason, detail, confirm) -->
    <div class="modal-overlay" id="generalModalOverlay" style="display: none;">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3 class="modal-title" id="generalModalTitle">Thông báo hệ thống</h3>
          <button class="modal-close-btn" onclick="AdminService.closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="generalModalBody"></div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js?v=20261018_v1"></script>
    <script src="js/storage.js?v=20261018_v999"></script>
    <script src="js/toast.js?v=20261018_v999"></script>
    <script src="js/auth.js?v=20261018_v999"></script>
    <script src="js/api.js?v=20261018_v999"></script>
    <script src="js/admin.js?v=20261022_v4"></script>
    <script>
      // Shim toàn cục tương thích ngược cho window.App trong Admin Portal
      window.App = window.App || {
        openModal: (t, c) => AdminService.openModal(t, c),
        closeModal: () => AdminService.closeModal(),
        openCarDetailModal: (id) => AdminService.openCarDetailModal(id),
        showToast: (m, type) => AdminService.showToast(m, type)
      };

      document.addEventListener("DOMContentLoaded", () => {
        StorageService.init();
        if (checkAuth("ADMIN")) {
          AdminService.renderAdminPortal("adminPortalContainer");
          const params = new URLSearchParams(window.location.search);
          const tab = params.get('tab') || window.location.hash.replace('#', '').toUpperCase();
          if (tab && typeof AdminService.switchTab === 'function') {
            setTimeout(() => AdminService.switchTab(tab), 150);
          }
        }
      });
    </script>
  </body>
</html>
