<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Kênh Quản Trị & Thẩm Định — DriveShare</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/portals.css" />
  </head>
  <body>
    <!-- Site Header -->
    <header class="site-header">
      <div class="container nav-container">
        <a href="index.html" class="brand-logo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"
            ></path>
            <circle cx="7" cy="17" r="2"></circle>
            <path d="M9 17h6"></path>
            <circle cx="17" cy="17" r="2"></circle>
          </svg>
          <span>DriveShare</span>
          <span class="brand-badge" style="background: #fee2e2; color: #b91c1c; border-color: #fca5a5;">Admin Portal</span>
        </a>
        <div class="nav-actions">
          <a href="index.html" class="btn btn-outline btn-sm" style="font-weight: 600;">
            Trang chủ
          </a>
          <a href="profile.html" class="btn btn-ghost btn-sm" style="font-weight: 600;">
            Hồ sơ cá nhân
          </a>
          <button class="btn btn-ghost btn-sm" onclick="AuthService.logout()" style="font-weight: 600; color: #ef4444;">
            Đăng xuất
          </button>
        </div>
      </div>
    </header>

    <main id="adminMainContent">
      <div id="adminPortalContainer">
        <!-- Rendered by AdminService.renderAdminPortal() -->
      </div>
    </main>

    <!-- General Action Modal (Rejection reason, detail, confirm) -->
    <div class="modal-overlay" id="generalModalOverlay" style="display: none;">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3 class="modal-title" id="generalModalTitle">Thông báo hệ thống</h3>
          <button class="modal-close-btn" onclick="AdminService.closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="generalModalBody"></div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        StorageService.init();
        if (checkAuth("ADMIN")) {
          AdminService.renderAdminPortal("adminPortalContainer");
        }
      });
    </script>
  </body>
</html>
