<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprint 4 QA Test Suite — Issue #48 (Frontend Responsive & Shopee Trip Tracker)</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/portals.css">
  <link rel="stylesheet" href="css/trip-tracker.css">
  <style>
    body {
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      color: #0f172a;
    }
    .test-header {
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      border: 1px solid #e2e8f0;
    }
    .test-matrix {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .test-case-row {
      background: #ffffff;
      padding: 16px 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 5px solid #cbd5e1;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      transition: all 0.2s;
    }
    .test-case-row.pass {
      border-left-color: #10b981;
      background: #f0fdf4;
    }
    .test-case-row.fail {
      border-left-color: #ef4444;
      background: #fef2f2;
    }
    .test-id {
      font-weight: 800;
      font-size: 0.95rem;
      min-width: 90px;
      color: #0f766e;
    }
    .test-desc {
      flex: 1;
      margin: 0 16px;
      font-size: 0.92rem;
    }
    .test-status {
      font-weight: 800;
      font-size: 0.82rem;
      padding: 4px 12px;
      border-radius: 20px;
      min-width: 95px;
      text-align: center;
    }
    .test-status.pending { background: #e2e8f0; color: #475569; }
    .test-status.pass { background: #d1fae5; color: #065f46; }
    .test-status.fail { background: #fee2e2; color: #991b1b; }
    .test-details {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
    }
    #logConsole {
      background: #0f172a;
      color: #38bdf8;
      font-family: monospace;
      padding: 16px;
      border-radius: 10px;
      max-height: 250px;
      overflow-y: auto;
      font-size: 0.82rem;
      margin-top: 24px;
      line-height: 1.5;
    }
    .sandbox-container {
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 16px;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="test-header">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
      <div>
        <h1 style="font-size: 1.5rem; margin-bottom: 6px; color:#0f766e;">🎯 Sprint 4 Self-Test Matrix (Issue #48)</h1>
        <p style="color: #64748b; font-size: 0.9rem; margin:0;">
          Frontend Lead Chí Tín (@CTnn1001) — Responsive Đa Thiết Bị, Nút & Modal Theo Dõi Hành Trình Shopee
        </p>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary" id="btnRunSprint4Tests" onclick="runSprint4Tests()">
          ▶ Chạy Kiểm Thử Toàn Bộ Matrix (TC-T01 -> TC-T05)
        </button>
      </div>
    </div>
  </div>

  <div class="test-matrix" id="testMatrix"></div>

  <div id="logConsole">
    [QA Test Runner] Sẵn sàng. Nhấn nút để kiểm thử 5 Test Cases chuẩn Issue #48...
  </div>

  <div class="sandbox-container">
    <h3 style="margin-top:0; font-size: 1rem; color:#334155;">Khu Vực Kiểm Thử Giao Diện Động (Sandbox)</h3>
    <div id="testRenterTripsSandbox"></div>
    <div id="testOwnerCarsSandbox"></div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/render.js"></script>
  <script src="js/trip-tracker.js"></script>
  <script src="js/owner.js"></script>
  <script src="js/app.js"></script>

  <script>
    const testCases = [
      { id: "TC-T01", title: "Responsive Mobile: Bảng chuyển thành Card dọc, không có thanh cuộn ngang tràn viền", fn: test_TC_T01 },
      { id: "TC-T02", title: "Nút [📍 Theo dõi hành trình] & Modal Shopee: Stepper sáng bước 4 (Đang đi), đếm ngược hoạt động", fn: test_TC_T02 },
      { id: "TC-T03", title: "Xử lý đơn OVERDUE: Modal cảnh báo quá hạn nhấp nháy đỏ & tính đúng phụ phí phạt trễ hạn", fn: test_TC_T03 },
      { id: "TC-T04", title: "Luồng Đánh Giá: Gửi đánh giá 5 sao thành công, badge đổi ngay sang ĐÃ HOÀN TẤT", fn: test_TC_T04 },
      { id: "TC-T05", title: "F12 Console Kiểm Tra: Tuyệt đối 0 lỗi đỏ (zero errors) trong quá trình hoạt động", fn: test_TC_T05 }
    ];

    let consoleErrors = [];
    const origError = console.error;
    console.error = function(...args) {
      consoleErrors.push(args.join(' '));
      origError.apply(console, args);
    };

    function log(msg) {
      const el = document.getElementById('logConsole');
      el.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
      el.scrollTop = el.scrollHeight;
      console.log(`[QA Test] ${msg}`);
    }

    function initMatrix() {
      const container = document.getElementById('testMatrix');
      container.innerHTML = testCases.map(tc => `
        <div class="test-case-row" id="row-${tc.id}">
          <div class="test-id">${tc.id}</div>
          <div class="test-desc">
            <strong>${tc.title}</strong>
            <div class="test-details" id="det-${tc.id}">Chưa thực thi</div>
          </div>
          <div class="test-status pending" id="status-${tc.id}">CHƯA CHẠY</div>
        </div>
      `).join('');
    }

    function updateTestResult(id, pass, message) {
      const row = document.getElementById(`row-${id}`);
      const stat = document.getElementById(`status-${id}`);
      const det = document.getElementById(`det-${id}`);
      if (pass) {
        row.className = 'test-case-row pass';
        stat.className = 'test-status pass';
        stat.textContent = 'PASSED ✔';
        det.innerHTML = `<span style="color:#059669; font-weight:600;">${message}</span>`;
      } else {
        row.className = 'test-case-row fail';
        stat.className = 'test-status fail';
        stat.textContent = 'FAILED ✕';
        det.innerHTML = `<span style="color:#dc2626; font-weight:600;">${message}</span>`;
      }
    }

    // =========================================================================
    // TEST IMPLEMENTATIONS
    // =========================================================================

    // TC-T01: Responsive Mobile Cards View & No Horizontal Scroll
    async function test_TC_T01() {
      log('Running TC-T01: Kiểm tra Table -> Card View & Scrollbar...');
      const sandbox = document.getElementById('testOwnerCarsSandbox');
      sandbox.innerHTML = `
        <div class="table-responsive">
          <table class="custom-table">
            <thead>
              <tr><th>Phương tiện</th><th>Biển số</th><th>Giá thuê</th></tr>
            </thead>
            <tbody>
              <tr>
                <td data-label="Phương tiện">VinFast VF8</td>
                <td data-label="Biển số">51K-888.99</td>
                <td data-label="Giá thuê">1.200.000 đ</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
      
      const table = sandbox.querySelector('table.custom-table');
      const td = sandbox.querySelector('td[data-label="Phương tiện"]');
      const hasDataLabel = td && td.getAttribute('data-label') === 'Phương tiện';

      // Kiểm tra Bottom Navigation Bar tồn tại
      App.initBottomNav();
      const bottomNav = document.getElementById('appBottomNavBar');
      const hasBottomNav = !!bottomNav && bottomNav.querySelectorAll('.bottom-nav-item').length === 4;

      // Kiểm tra tràn cuộn ngang
      const bodyWidth = document.body.clientWidth;
      const scrollWidth = document.body.scrollWidth;
      const noOverflow = scrollWidth <= bodyWidth + 2;

      if (hasDataLabel && hasBottomNav && noOverflow) {
        return { pass: true, msg: 'Đã chuẩn hóa Cards View với data-label, Bottom Navigation Bar 4 mục, không tràn cuộn ngang.' };
      }
      return { pass: false, msg: `Kiểm tra thất bại: dataLabel=${hasDataLabel}, bottomNav=${hasBottomNav}, noOverflow=${noOverflow}` };
    }

    // TC-T02: Nút [📍 Theo dõi hành trình] & Modal Shopee trên đơn IN_PROGRESS
    async function test_TC_T02() {
      log('Running TC-T02: Kiểm tra nút và Modal Shopee trên đơn IN_PROGRESS...');
      const mockTrip = {
        rentalId: 8881,
        carBrand: 'VinFast',
        carModel: 'VF8 Plus',
        carPlateNumber: '51K-889.99',
        pickupAddress: '120 Lê Lợi, Q1, TP.HCM',
        startDate: '2026-10-24',
        endDate: '2026-10-28',
        totalPrice: 2400000,
        depositAmount: 720000,
        status: 'IN_PROGRESS'
      };

      // Mở modal
      await TripTrackerService.openTrackerModal(8881);
      await new Promise(r => setTimeout(r, 200));

      const modal = document.getElementById('tripTrackerModal');
      const isVisible = modal && (modal.classList.contains('active') || modal.style.display === 'flex');
      const stepActive = modal ? modal.querySelector('.step-item.active') : null;
      const stepText = stepActive ? stepActive.textContent : '';
      const countdown = document.getElementById('tripCountdownValue');
      const countdownRunning = countdown && countdown.textContent.includes('Còn');

      TripTrackerService.closeTrackerModal();

      if (isVisible && stepText.includes('Đang Đi') && countdownRunning) {
        return { pass: true, msg: 'Modal Shopee mở mượt mà, Stepper sáng đúng bước số 4 (Đang Đi), đồng hồ đếm ngược chạy chính xác.' };
      }
      return { pass: false, msg: `Lỗi: isVisible=${isVisible}, stepText=${stepText}, countdownRunning=${countdownRunning}` };
    }

    // TC-T03: Xem đơn OVERDUE -> Modal cảnh báo đỏ & tính tiền phạt
    async function test_TC_T03() {
      log('Running TC-T03: Kiểm tra đơn OVERDUE và phụ phí phạt...');
      const mockOverdue = {
        rentalId: 9992,
        carBrand: 'Toyota',
        carModel: 'Camry 2.5Q',
        carPlateNumber: '51H-333.22',
        pickupAddress: '200 Pasteur, Q3, TP.HCM',
        startDate: '2026-10-20',
        endDate: '2026-10-23',
        pricePerDay: 1500000,
        totalPrice: 4500000,
        depositAmount: 1350000,
        overdueHours: 6,
        penaltyFee: 562500,
        status: 'OVERDUE'
      };

      // Đưa vào cache
      App.cachedMyBookings = App.cachedMyBookings || [];
      App.cachedMyBookings.push(mockOverdue);

      await TripTrackerService.openTrackerModal(9992);
      await new Promise(r => setTimeout(r, 200));

      const modal = document.getElementById('tripTrackerModal');
      const isOverdueStep = modal ? modal.querySelector('.step-item.overdue') : null;
      const warningBox = modal ? modal.querySelector('.overdue-penalty-box') : null;
      const hasPenaltyText = warningBox && warningBox.textContent.includes('562.500');

      TripTrackerService.closeTrackerModal();

      if (isOverdueStep && warningBox && hasPenaltyText) {
        return { pass: true, msg: 'Modal hiện cảnh báo đỏ nhấp nháy ĐÃ QUÁ HẠN, tính đúng tiền phạt trễ hạn 562.500 đ (150% đơn giá).' };
      }
      return { pass: false, msg: `Lỗi: isOverdueStep=${!!isOverdueStep}, warningBox=${!!warningBox}, hasPenaltyText=${hasPenaltyText}` };
    }

    // TC-T04: Bấm đánh giá chuyến đi -> Gửi đánh giá, badge đổi sang ĐÃ HOÀN TẤT
    async function test_TC_T04() {
      log('Running TC-T04: Luồng Đánh giá và đổi trạng thái ĐÃ HOÀN TẤT...');
      const testRentalId = 7773;
      const testRental = {
        id: testRentalId,
        rental_id: testRentalId,
        rentalId: testRentalId,
        car_brand: 'Mazda',
        car_model: '3 Luxury',
        car_plate_number: '51G-888.99',
        total_price: 1800000,
        deposit_amount: 540000,
        status: 'IN_PROGRESS'
      };

      App.cachedMyBookings = App.cachedMyBookings || [];
      App.cachedMyBookings.push(testRental);
      if (typeof StorageService !== 'undefined') {
        const bks = StorageService.getBookings();
        bks.push(testRental);
        StorageService.saveBookings(bks);
      }

      // Mở modal review
      await App.showReviewPrompt(testRentalId);
      await new Promise(r => setTimeout(r, 200));

      // Điền nội dung và submit
      const commentInput = document.getElementById('reviewCommentText');
      if (commentInput) commentInput.value = 'Xe chạy rất êm, chủ xe nhiệt tình tuyệt vời!';
      App.setReviewStar(5);

      await App.submitReview(testRentalId);
      await new Promise(r => setTimeout(r, 400));

      // Kiểm tra đơn đã hoàn tất
      let isCompleted = false;
      if (Array.isArray(App.cachedMyBookings)) {
        const updated = App.cachedMyBookings.find(b => String(b.rental_id || b.rentalId || b.id) === String(testRentalId));
        if (updated && updated.status === 'COMPLETED') isCompleted = true;
      }
      if (!isCompleted && typeof StorageService !== 'undefined') {
        const updated = StorageService.getBookings().find(b => String(b.rental_id || b.rentalId || b.id) === String(testRentalId));
        if (updated && updated.status === 'COMPLETED') isCompleted = true;
      }

      return { pass: isCompleted, msg: 'Gửi đánh giá 5 sao thành công, đơn thuê tự động cập nhật sang trạng thái ĐÃ HOÀN TẤT.' };
    }

    // TC-T05: Mở F12 Console kiểm tra sạch sẽ 0 lỗi đỏ
    async function test_TC_T05() {
      log('Running TC-T05: Kiểm tra Console Errors...');
      if (consoleErrors.length === 0) {
        return { pass: true, msg: 'F12 Console sạch sẽ tuyệt đối 0 lỗi đỏ (0 errors) trong toàn bộ quá trình chạy!' };
      }
      return { pass: false, msg: `Phát hiện ${consoleErrors.length} lỗi console: ${consoleErrors.join('; ')}` };
    }

    async function runSprint4Tests() {
      log('=== BẮT ĐẦU CHẠY SPRINT 4 TEST SUITE ===');
      for (const tc of testCases) {
        try {
          const res = await tc.fn();
          updateTestResult(tc.id, res.pass, res.msg);
          log(`[${tc.id}] ${res.pass ? 'PASS' : 'FAIL'} - ${res.msg}`);
        } catch (err) {
          updateTestResult(tc.id, false, `Exception: ${err.message}`);
          log(`[${tc.id}] ERROR - ${err.message}`);
        }
      }
      log('=== HOÀN TẤT TẤT CẢ TEST CASES SPRINT 4 ===');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initMatrix();
    });
  </script>
</body>
</html>
