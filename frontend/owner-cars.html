<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Quản Lý Xe Của Tôi — DriveShare</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/portals.css?v=4.0" />
    <link rel="stylesheet" href="css/trip-tracker.css?v=4.0" />
  </head>
  <body>
    <!-- Site Header -->
    <header class="site-header">
      <div class="container nav-container">
        <a href="index.html" class="brand-logo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"
            ></path>
            <circle cx="7" cy="17" r="2"></circle>
            <path d="M9 17h6"></path>
            <circle cx="17" cy="17" r="2"></circle>
          </svg>
          <span>DriveShare</span>
          <span class="brand-badge">Kênh Chủ Xe</span>
        </a>
        <div class="nav-actions">
          <!-- Notification Bell Dropdown (Sprint 3) -->
          <div id="notificationBellContainer" class="notification-bell-container"></div>
          <a href="index.html" class="btn btn-outline btn-sm" style="font-weight: 600;">
            Về trang chủ
          </a>
          <a href="owner-earnings.html" class="btn btn-ghost btn-sm" style="font-weight: 600; color: #047857;">
            Doanh thu & Lịch sử cọc
          </a>
          <a href="profile.html" class="btn btn-ghost btn-sm" style="font-weight: 600;">
            Hồ sơ cá nhân
          </a>
          <button class="btn btn-ghost btn-sm" onclick="AuthService.logout()" style="font-weight: 600; color: #ef4444;">
            Đăng xuất
          </button>
        </div>
      </div>
    </header>

    <main id="ownerMainContent">
      <div id="ownerPortalContainer">
        <!-- Rendered by OwnerService.renderOwnerPortal() -->
      </div>
    </main>

    <!-- Modal Xem Chi Tiết Xe (CRP-37) -->
    <div class="modal-overlay" id="carDetailModalOverlay">
      <div class="modal-dialog" style="max-width: 860px; width: 95%;">
        <div class="modal-header">
          <h3 class="modal-title" id="carDetailModalTitle">Chi tiết phương tiện</h3>
          <button class="modal-close-btn" onclick="document.getElementById('carDetailModalOverlay').classList.remove('open')">&times;</button>
        </div>
        <div class="modal-body" id="carDetailModalBody"></div>
      </div>
    </div>

    <!-- Modal Quản Lý Ảnh Xe (CRP-33) -->
    <div class="modal-overlay" id="carPhotosModalOverlay">
      <div class="modal-dialog" style="max-width: 650px;">
        <div class="modal-header">
          <h3 class="modal-title" id="carPhotosModalTitle">Quản lý hình ảnh xe</h3>
          <button class="modal-close-btn" onclick="document.getElementById('carPhotosModalOverlay').classList.remove('open')">&times;</button>
        </div>
        <div class="modal-body" id="carPhotosModalBody"></div>
      </div>
    </div>

    <!-- Modal Quản Lý Lịch Xe & Chặn Ngày Bận (CRP-40) -->
    <div class="modal-overlay" id="carCalendarModalOverlay">
      <div class="modal-dialog" style="max-width: 900px; width: 95%;">
        <div class="modal-header">
          <h3 class="modal-title" id="carCalendarModalTitle">Lịch Xe & Quản Lý Ngày Bận</h3>
          <button class="modal-close-btn" onclick="document.getElementById('carCalendarModalOverlay').classList.remove('open')">&times;</button>
        </div>
        <div class="modal-body" id="carCalendarModalBody"></div>
      </div>
    </div>

    <!-- Modal Sửa Thông Tin Xe (Update Product — Dàn ngang tối ưu diện tích) -->
    <div class="modal-overlay" id="editCarModalOverlay">
      <div class="modal-dialog" style="max-width: 960px; width: 95%;">
        <div class="modal-header">
          <h3 class="modal-title" id="editCarModalTitle">Cập nhật thông tin xe</h3>
          <button class="modal-close-btn" onclick="document.getElementById('editCarModalOverlay').classList.remove('open')">&times;</button>
        </div>
        <div class="modal-body" id="editCarModalBody"></div>
      </div>
    </div>

    <!-- Modal Phóng To Xem Ảnh (Lightbox) -->
    <div class="modal-overlay" id="imagePreviewModalOverlay" onclick="this.classList.remove('open')">
      <div class="modal-dialog" style="max-width: 720px; background: transparent; box-shadow: none; border: none; text-align: center;" onclick="event.stopPropagation()">
        <div style="position: relative; display: inline-block; max-width: 100%;">
          <button class="modal-close-btn" style="position: absolute; top: -14px; right: -14px; background: #0f172a; color: #fff; width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; font-size: 18px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;" onclick="document.getElementById('imagePreviewModalOverlay').classList.remove('open')">&times;</button>
          <img id="imagePreviewModalImg" src="" alt="Ảnh phóng to" style="max-width: 100%; max-height: 82vh; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); object-fit: contain; background: #fff;" />
          <div id="imagePreviewModalCaption" style="margin-top: 10px; color: #fff; font-weight: 700; font-size: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.9);"></div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js?v=3.5"></script>
    <script src="js/storage.js?v=3.5"></script>
    <script src="js/toast.js?v=3.5"></script>
    <script src="js/auth.js?v=3.5"></script>
    <script src="js/api.js?v=3.5"></script>
    <script src="js/render.js?v=3.5"></script>
    <script src="js/trip-tracker.js?v=4.0"></script>
    <script src="js/owner.js?v=4.0"></script>
    <script>
      window.App = window.App || {
        showToast: (msg, type) => {
          if (typeof toast !== 'undefined' && typeof toast[type] === 'function') toast[type](msg);
          else if (typeof showToast === 'function') showToast(msg, type);
          else alert(msg);
        },
        zoomImage: (src, caption) => {
          if (typeof OwnerService !== 'undefined' && OwnerService.zoomImage) {
            OwnerService.zoomImage(src, caption);
          } else {
            window.open(src, '_blank');
          }
        }
      };

      document.addEventListener("DOMContentLoaded", () => {
        StorageService.init();
        if (typeof getAccessToken === 'function' && !getAccessToken()) {
          // Tự động khởi tạo phiên demo chủ xe khi xem giao diện quản lý xe
          localStorage.setItem("access_token", "demo_owner_token");
          localStorage.setItem("user_info", JSON.stringify({
            id: 1,
            email: "owner@driveshare.vn",
            fullName: "Lê Hoàng Long (Chủ xe)",
            role: "ROLE_OWNER",
            roles: ["ROLE_OWNER"]
          }));
        }
        if (typeof checkAuth === 'function') {
          checkAuth("OWNER");
        }
        OwnerService.renderOwnerPortal("ownerPortalContainer");
      });
    </script>

    <!-- Mobile Bottom Navigation Bar (Sprint 4 - Issue #48) -->
    <nav class="bottom-nav-bar" id="appBottomNavBar">
      <a href="index.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span class="bottom-nav-label">Trang chủ</span>
      </a>
      <a href="index.html#my-bookings" class="bottom-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span class="bottom-nav-label">Chuyến đi</span>
      </a>
      <a href="owner-cars.html" class="bottom-nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg>
        <span class="bottom-nav-label">Quản lý xe</span>
      </a>
      <a href="profile.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span class="bottom-nav-label">Hồ sơ</span>
      </a>
    </nav>
  </body>
</html>
