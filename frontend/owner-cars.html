<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Quản Lý Xe Của Tôi — DriveShare</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/portals.css" />
  </head>
  <body>
    <!-- Site Header -->
    <header class="site-header">
      <div class="container nav-container">
        <a href="index.html" class="brand-logo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"
            ></path>
            <circle cx="7" cy="17" r="2"></circle>
            <path d="M9 17h6"></path>
            <circle cx="17" cy="17" r="2"></circle>
          </svg>
          <span>DriveShare</span>
          <span class="brand-badge">Kênh Chủ Xe</span>
        </a>
        <div class="nav-actions">
          <a href="index.html" class="btn btn-outline btn-sm" style="font-weight: 600;">
            Về trang chủ
          </a>
          <a href="owner-earnings.html" class="btn btn-ghost btn-sm" style="font-weight: 600; color: #047857;">
            Doanh thu & Lịch sử cọc
          </a>
          <a href="profile.html" class="btn btn-ghost btn-sm" style="font-weight: 600;">
            Hồ sơ cá nhân
          </a>
          <button class="btn btn-ghost btn-sm" onclick="AuthService.logout()" style="font-weight: 600; color: #ef4444;">
            Đăng xuất
          </button>
        </div>
      </div>
    </header>

    <main id="ownerMainContent">
      <div id="ownerPortalContainer">
        <!-- Rendered by OwnerService.renderOwnerPortal() -->
      </div>
    </main>

    <!-- Modal Xem Chi Tiết Xe -->
    <div class="modal-overlay" id="carDetailModalOverlay">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3 class="modal-title" id="carDetailModalTitle">Chi tiết phương tiện</h3>
          <button class="modal-close-btn" onclick="document.getElementById('carDetailModalOverlay').classList.remove('open')">&times;</button>
        </div>
        <div class="modal-body" id="carDetailModalBody"></div>
      </div>
    </div>

    <!-- Modal Quản Lý Ảnh Xe (CRP-33) -->
    <div class="modal-overlay" id="carPhotosModalOverlay">
      <div class="modal-dialog" style="max-width: 650px;">
        <div class="modal-header">
          <h3 class="modal-title" id="carPhotosModalTitle">Quản lý hình ảnh xe</h3>
          <button class="modal-close-btn" onclick="document.getElementById('carPhotosModalOverlay').classList.remove('open')">&times;</button>
        </div>
        <div class="modal-body" id="carPhotosModalBody"></div>
      </div>
    </div>

    <!-- Modal Sửa Thông Tin Xe (Update Product — Dàn ngang tối ưu diện tích) -->
    <div class="modal-overlay" id="editCarModalOverlay">
      <div class="modal-dialog" style="max-width: 960px; width: 95%;">
        <div class="modal-header">
          <h3 class="modal-title" id="editCarModalTitle">Cập nhật thông tin xe</h3>
          <button class="modal-close-btn" onclick="document.getElementById('editCarModalOverlay').classList.remove('open')">&times;</button>
        </div>
        <div class="modal-body" id="editCarModalBody"></div>
      </div>
    </div>

    <!-- Modal Phóng To Xem Ảnh (Lightbox) -->
    <div class="modal-overlay" id="imagePreviewModalOverlay" onclick="this.classList.remove('open')">
      <div class="modal-dialog" style="max-width: 720px; background: transparent; box-shadow: none; border: none; text-align: center;" onclick="event.stopPropagation()">
        <div style="position: relative; display: inline-block; max-width: 100%;">
          <button class="modal-close-btn" style="position: absolute; top: -14px; right: -14px; background: #0f172a; color: #fff; width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; font-size: 18px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;" onclick="document.getElementById('imagePreviewModalOverlay').classList.remove('open')">&times;</button>
          <img id="imagePreviewModalImg" src="" alt="Ảnh phóng to" style="max-width: 100%; max-height: 82vh; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); object-fit: contain; background: #fff;" />
          <div id="imagePreviewModalCaption" style="margin-top: 10px; color: #fff; font-weight: 700; font-size: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.9);"></div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js?v=3.5"></script>
    <script src="js/storage.js?v=3.5"></script>
    <script src="js/toast.js?v=3.5"></script>
    <script src="js/auth.js?v=3.5"></script>
    <script src="js/api.js?v=3.5"></script>
    <script src="js/owner.js?v=3.5"></script>
    <script>
      window.App = window.App || {
        showToast: (msg, type) => {
          if (typeof toast !== 'undefined' && typeof toast[type] === 'function') toast[type](msg);
          else if (typeof showToast === 'function') showToast(msg, type);
          else alert(msg);
        }
      };

      document.addEventListener("DOMContentLoaded", () => {
        StorageService.init();
        if (checkAuth("OWNER")) {
          OwnerService.renderOwnerPortal("ownerPortalContainer");
        }
      });
    </script>
  </body>
</html>
