server:
  port: 8080

spring:
  application:
    name: driveshare-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:drivesharedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key-not-set}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

jwt:
  secret: ${JWT_SECRET:driveshareSecretKeyForTestingSprintAndLocalDevelopmentOnly32BytesLong!}
  expiration: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
