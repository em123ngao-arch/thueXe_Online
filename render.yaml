databases:
  # Dịch vụ 1: Database PostgreSQL miễn phí trên Render
  - name: driveshare-db
    databaseName: driveshare_db
    user: driveshare_user
    plan: free
    region: singapore

services:
  # Dịch vụ 2: Backend Spring Boot chạy trong Docker
  - type: web
    name: driveshare-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DB_HOST
        value: dpg-dbqt83dckfvc739c03sg-a
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: driveshare_db_w52b
      - key: DB_USERNAME
        value: driveshare_user
      - key: DB_PASSWORD
        value: tzC0gfoUdKvJEnspNEKhTNXIEmICoaMV
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://dpg-dbqt83dckfvc739c03sg-a:5432/driveshare_db_w52b
      - key: SPRING_DATASOURCE_USERNAME
        value: driveshare_user
      - key: SPRING_DATASOURCE_PASSWORD
        value: tzC0gfoUdKvJEnspNEKhTNXIEmICoaMV
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_USER
        value: dongocphat007@gmail.com
      - key: MAIL_APP_PASSWORD
        value: zcruwmquqasueimg

  # Dịch vụ 3: Frontend Web tĩnh (HTML/CSS/JS)
  - type: web
    name: driveshare-frontend
    runtime: static
    staticPublishPath: frontend
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
