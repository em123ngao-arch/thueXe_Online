version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: driveshare-postgres
    restart: always
    environment:
      POSTGRES_DB: driveshare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: driveshare-adminer
    restart: always
    ports:
      - "8088:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
