name: DriveShare CI Quality Gate

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  quality-gate:
    name: Build, Test & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Run Spring Boot Unit Tests (150 tests)
        working-directory: backend
        run: ./mvnw clean test --no-transfer-progress

      - name: Set up Node.js for Frontend Verification
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Frontend JavaScript Syntax
        run: |
          echo "Validating Frontend JS files syntax..."
          for file in frontend/js/*.js; do
            if [ -f "$file" ]; then
              node -c "$file"
              echo "✔ Syntax OK: $file"
            fi
          done
